# Reverse proxy for the compute-commons hub.
# Place at /etc/nginx/sites-available/hub.chanza.io, symlink into sites-enabled.
# Run certbot afterwards -- it edits this file in place to add the TLS block
# and the port-80-to-443 redirect. Don't hand-write the TLS section yourself.

server {
    listen 80;
    server_name hub.chanza.io;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
