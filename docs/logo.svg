<svg width="640" height="160" viewBox="0 0 640 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="og-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7c8"/>
      <stop offset="100%" stop-color="#7aa2ff"/>
    </linearGradient>
  </defs>

  <!-- constellation mark: a small network of nodes, evoking both a compute
       grid and the night sky this project takes its name and spirit from -->
  <g stroke="url(#og-grad)" stroke-width="1.6" stroke-opacity="0.75" fill="none">
    <line x1="80" y1="80" x2="34" y2="46"/>
    <line x1="80" y1="80" x2="30" y2="104"/>
    <line x1="80" y1="80" x2="74" y2="24"/>
    <line x1="80" y1="80" x2="128" y2="40"/>
    <line x1="80" y1="80" x2="134" y2="100"/>
    <line x1="80" y1="80" x2="96" y2="132"/>
    <line x1="34" y1="46" x2="74" y2="24"/>
    <line x1="128" y1="40" x2="134" y2="100"/>
    <line x1="30" y1="104" x2="96" y2="132"/>
  </g>
  <g fill="url(#og-grad)">
    <circle cx="80" cy="80" r="10"/>
    <circle cx="34" cy="46" r="5.5"/>
    <circle cx="30" cy="104" r="5.5"/>
    <circle cx="74" cy="24" r="5"/>
    <circle cx="128" cy="40" r="5.5"/>
    <circle cx="134" cy="100" r="5.5"/>
    <circle cx="96" cy="132" r="5"/>
  </g>

  <text x="176" y="98" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="56" font-weight="700" letter-spacing="-1.5" fill="url(#og-grad)">Omnigrid</text>
</svg>
